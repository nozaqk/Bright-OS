# =============================================================================
# Bright OS ISO Build Workflow
# =============================================================================
# Builds all three Bright OS editions (Home, Developer, Lite) on Debian Trixie
# and publishes them to GitHub Releases.
#
# Triggers:
#   push tags v*        -> build all editions + create GitHub Release
#   workflow_dispatch   -> manual build, artifacts only (no release)
# =============================================================================

name: Build Bright OS ISOs

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (default: 0.1.0-dev)'
        required: false
        default: '0.1.0-dev'
      edition:
        description: 'Edition to build'
        required: false
        type: choice
        options:
          - all
          - home
          - developer
          - lite
        default: 'all'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================================
  # Build matrix: one parallel job per edition
  # ==========================================================================
  build-edition:
    name: Build ${{ matrix.edition }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: home
            arch: amd64
            description: Bright OS Home
          - edition: developer
            arch: amd64
            description: Bright OS Developer
          - edition: lite
            arch: amd64
            description: Bright OS Lite
    if: |
      github.event_name == 'push' ||
      github.event.inputs.edition == 'all' ||
      github.event.inputs.edition == matrix.edition
    steps:

      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h /
          echo ""
          echo "=== Aggressively freeing disk space (target: 40+ GB free) ==="

          # Disable and remove swap (frees ~4 GB)
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true

          # Remove large preinstalled directories
          sudo rm -rf /usr/local/lib/android 2>/dev/null || true   # ~14 GB
          sudo rm -rf /usr/share/dotnet 2>/dev/null || true         # ~4 GB
          sudo rm -rf /opt/ghc 2>/dev/null || true                  # Haskell ~2.5 GB
          sudo rm -rf /usr/local/.ghcup 2>/dev/null || true         # ~1 GB
          sudo rm -rf /usr/share/swift 2>/dev/null || true          # Swift ~3 GB
          sudo rm -rf /usr/share/miniconda* /usr/local/lib/miniconda* 2>/dev/null || true  # ~1 GB
          sudo rm -rf /usr/local/share/boost 2>/dev/null || true    # ~1 GB
          sudo rm -rf /opt/hostedtoolcache 2>/dev/null || true      # ~6 GB (CodeQL, Node, Go, etc.)
          sudo rm -rf /usr/local/lib/node_modules 2>/dev/null || true
          sudo rm -rf /var/lib/gems 2>/dev/null || true
          sudo rm -rf /usr/share/azure* 2>/dev/null || true
          sudo rm -rf /var/log/* 2>/dev/null || true

          # Remove preinstalled packages
          sudo apt-get remove -y '^dotnet-.*' '^aspnetcore-.*' 2>/dev/null || true
          sudo apt-get remove -y '^libmono-.*' '^mono-.*' 2>/dev/null || true
          sudo apt-get remove -y '^llvm-.*' '^clang-.*' '^gcc-1[0-2]-.*' 2>/dev/null || true
          sudo apt-get remove -y '^mysql-.*' '^postgresql-.*' '^mongodb-.*' '^mssql-.*' 2>/dev/null || true
          sudo apt-get remove -y '^php-.*' '^php8.*' 2>/dev/null || true
          sudo apt-get remove -y '^google-chrome-.*' '^chromium-.*' '^firefox-.*' 2>/dev/null || true
          sudo apt-get remove -y '^android-.*' 2>/dev/null || true
          sudo apt-get remove -y '^temurin-.*' '^openjdk-.*' '^jdk-.*' 2>/dev/null || true
          sudo apt-get remove -y '^r-base-.*' '^r-cran-.*' 2>/dev/null || true
          sudo apt-get remove -y '^haskell-.*' '^ghc-.*' 2>/dev/null || true
          sudo apt-get remove -y '^powershell-.*' '^azl-.*' 2>/dev/null || true
          sudo apt-get autoremove -y --purge 2>/dev/null || true
          sudo apt-get clean

          # Remove Docker images we don't need (debian:trixie will be pulled fresh)
          sudo docker image prune -af 2>/dev/null || true

          # Clean apt caches
          sudo rm -rf /var/cache/apt/archives/*.deb 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives/partial/* 2>/dev/null || true
          sudo rm -rf /tmp/* /var/tmp/* 2>/dev/null || true

          echo ""
          echo "=== Disk space AFTER cleanup ==="
          df -h /
          echo ""
          FREE_KB=$(df --output=avail / | tail -1 | tr -d ' ')
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Free space: ${FREE_GB} GB"
          if [ "$FREE_GB" -lt 25 ]; then
            echo "ERROR: Only ${FREE_GB} GB free after cleanup; need at least 25 GB for live-build"
            exit 1
          fi
          echo "Sufficient disk space available.

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if ! echo "$VERSION" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "Invalid version string: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build ${{ matrix.edition }} ISO
        id: build
        env:
          EDITION: ${{ matrix.edition }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Build command: bash build/scripts/ci/build-in-container.sh ${EDITION} ${VERSION} ${ARCH}"
          bash build/scripts/ci/build-in-container.sh "${EDITION}" "${VERSION}" "${ARCH}"
        # Capture build exit code
        # On failure, we still want to upload logs

      - name: Validate ${{ matrix.edition }} ISO
        id: validate
        env:
          EDITION: ${{ matrix.edition }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bash build/scripts/ci/validate-in-container.sh "${EDITION}" "${VERSION}" "${ARCH}"

      - name: Stage artifacts
        if: always() && (steps.build.outcome == 'success' || steps.validate.outcome == 'success')
        env:
          EDITION: ${{ matrix.edition }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          STAGING="artifact-staging/${EDITION}"
          mkdir -p "${STAGING}"

          ISO_NAME="bright-os-${VERSION}-${EDITION}-${ARCH}.iso"
          ISO_PATH="build/output/${EDITION}/${ISO_NAME}"
          LOG_PATH="build/output/${EDITION}/build.log"

          if [ -f "${ISO_PATH}" ]; then
            cp "${ISO_PATH}" "${STAGING}/${ISO_NAME}"
            if [ -f "${ISO_PATH}.sha256" ]; then
              cp "${ISO_PATH}.sha256" "${STAGING}/${ISO_NAME}.sha256"
            fi
          fi

          if [ -f "${LOG_PATH}" ]; then
            cp "${LOG_PATH}" "${STAGING}/build.log"
          fi

          # Write metadata
          {
            echo "edition=${EDITION}"
            echo "version=${VERSION}"
            echo "arch=${ARCH}"
            echo "iso=${ISO_NAME}"
            echo "build_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "build_status=success"
            if [ -f "${ISO_PATH}" ]; then
              echo "size_bytes=$(stat -c%s "${ISO_PATH}")"
              echo "size_mb=$(( $(stat -c%s "${ISO_PATH}") / 1024 / 1024 ))"
            fi
            if [ -f "${ISO_PATH}.sha256" ]; then
              echo "sha256=$(cut -d' ' -f1 "${ISO_PATH}.sha256")"
            fi
          } > "${STAGING}/EDITION.txt"

          echo "Staged artifacts:"
          ls -la "${STAGING}/"

      - name: Upload artifact - ${{ matrix.edition }}
        if: always() && (steps.build.outcome == 'success' || steps.validate.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bright-os-${{ matrix.edition }}-${{ matrix.arch }}
          path: artifact-staging/${{ matrix.edition }}/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Show build log on failure
        if: failure()
        env:
          EDITION: ${{ matrix.edition }}
        shell: bash
        run: |
          LOG_PATH="build/output/${EDITION}/build.log"
          echo "=== Build failed for ${EDITION} ==="
          if [ -f "${LOG_PATH}" ]; then
            echo "Last 100 lines of build.log:"
            echo "----------------------------------------"
            tail -100 "${LOG_PATH}" || true
            echo "----------------------------------------"
          else
            echo "Build log not found at ${LOG_PATH}"
            echo "Build directory contents:"
            ls -la "build/output/${EDITION}/" 2>/dev/null || echo "(directory does not exist)"
          fi

  # ==========================================================================
  # Release job: runs after ALL editions build and validate successfully
  # ==========================================================================
  create-release:
    name: Create GitHub Release
    needs: build-edition
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TITLE_VERSION=$(echo "$VERSION" | sed 's/-alpha/ Alpha/; s/-beta/ Beta/; s/-rc/ Release Candidate/; s/-dev/ Development/')
          echo "title_version=$TITLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Download all edition artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets/
          pattern: bright-os-*-amd64

      - name: Verify artifacts and create SHA256SUMS
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Downloaded artifacts ==="
          find release-assets/ -type f -ls
          echo ""

          SHA_FILE="release-assets/SHA256SUMS"
          : > "${SHA_FILE}"

          EXPECTED_EDITIONS="home developer lite"
          MISSING=""

          for edition in $EXPECTED_EDITIONS; do
            ARTIFACT_DIR="release-assets/bright-os-${edition}-amd64"
            ISO_NAME="bright-os-${VERSION}-${edition}-amd64.iso"
            ISO_PATH="${ARTIFACT_DIR}/${ISO_NAME}"

            echo ""
            echo "--- Checking ${edition} ---"

            if [ ! -d "${ARTIFACT_DIR}" ]; then
              echo "ERROR: Missing artifact directory: ${ARTIFACT_DIR}"
              MISSING="${MISSING} ${edition}"
              continue
            fi

            if [ ! -f "${ISO_PATH}" ]; then
              echo "ERROR: Missing ISO: ${ISO_PATH}"
              ls -la "${ARTIFACT_DIR}/"
              MISSING="${MISSING} ${edition}"
              continue
            fi

            if [ ! -s "${ISO_PATH}" ]; then
              echo "ERROR: Empty ISO: ${ISO_PATH}"
              MISSING="${MISSING} ${edition}"
              continue
            fi

            if [ ! -f "${ARTIFACT_DIR}/${ISO_NAME}.sha256" ]; then
              echo "ERROR: Missing checksum file for ${edition}"
              MISSING="${MISSING} ${edition}"
              continue
            fi

            if ! (cd "${ARTIFACT_DIR}" && sha256sum -c "${ISO_NAME}.sha256"); then
              echo "ERROR: Checksum mismatch for ${edition}"
              exit 1
            fi
            echo "Checksum: OK"

            SIZE_MB=$(du -m "${ISO_PATH}" | cut -f1)
            echo "Size: ${SIZE_MB} MB"

            HASH=$(cut -d' ' -f1 "${ARTIFACT_DIR}/${ISO_NAME}.sha256")
            echo "${HASH}  ${ISO_NAME}" >> "${SHA_FILE}"
          done

          if [ -n "${MISSING}" ]; then
            echo ""
            echo "ERROR: Missing or invalid editions:${MISSING}"
            exit 1
          fi

          echo ""
          echo "=== Consolidated SHA256SUMS ==="
          cat "${SHA_FILE}"

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TITLE_VERSION: ${{ steps.version.outputs.title_version }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT_SHA="${GITHUB_SHA:0:10}"
          ISO_HOME="bright-os-${VERSION}-home-amd64.iso"
          ISO_DEV="bright-os-${VERSION}-developer-amd64.iso"
          ISO_LITE="bright-os-${VERSION}-lite-amd64.iso"
          {
            echo "# Bright OS ${TITLE_VERSION}"
            echo ""
            echo "**Debian base:** Debian 13 Trixie"
            echo "**Architecture:** x86_64 / amd64"
            echo "**Build date:** ${BUILD_DATE}"
            echo "**Commit:** \`${COMMIT_SHA}\`"
            echo ""
            echo "## Available Editions"
            echo ""
            echo "| Edition | ISO File | Description |"
            echo "|---------|----------|-------------|"
            echo "| Home | \`${ISO_HOME}\` | Full KDE Plasma desktop for everyday use (web, office, media) |"
            echo "| Developer | \`${ISO_DEV}\` | KDE Plasma + development tools (Git, Docker, Arduino, KiCad, databases) |"
            echo "| Lite | \`${ISO_LITE}\` | Lightweight LXQt + Openbox desktop for older hardware (2-4 GB RAM) |"
            echo ""
            echo "## Verify Downloads"
            echo ""
            echo "After downloading, verify the integrity of your ISO:"
            echo "\`\`\`"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "\`\`\`"
            echo ""
            echo "## Write to USB"
            echo ""
            echo "\`\`\`"
            echo "sudo dd if=${ISO_HOME} of=/dev/sdX bs=4M status=progress conv=fsync"
            echo "\`\`\`"
            echo ""
            echo "Boot from the USB drive; the Calamares installer launches from the live desktop."
            echo ""
            echo "## Testing Status"
            echo ""
            echo "- **Structural validation passed:** ISO9660 filesystem, kernel, initrd, squashfs root, BIOS MBR boot signature, UEFI EFI boot image, and GRUB bootloader verified by CI."
            echo "- **Boot testing not yet performed:** ISOs have NOT been booted in QEMU or on real hardware. This is an automated build - please test in a VM before installing on production hardware."
            echo "- **Secure Boot:** shim-signed is included but Secure Boot support is untested. Disable Secure Boot if you encounter boot issues."
            echo "- **LUKS:** Full-disk encryption via Calamares is configured but untested in CI."
            echo ""
            echo "## Known Issues (Alpha)"
            echo ""
            echo "- Early development software - expect bugs and missing features"
            echo "- Wine/Proton compatibility layer is not yet included (planned for a future release)"
            echo "- No automatic updates configured"
            echo "- Some hardware may require additional firmware"
          } > release-notes.md

          echo "=== Release Notes ==="
          cat release-notes.md

      - name: Create GitHub Release
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TITLE_VERSION: ${{ steps.version.outputs.title_version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          echo "=== Creating release: ${TAG} ==="

          gh release create "${TAG}" \
            --title "Bright OS ${TITLE_VERSION}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            "release-assets/bright-os-home-amd64/bright-os-${VERSION}-home-amd64.iso" \
            "release-assets/bright-os-developer-amd64/bright-os-${VERSION}-developer-amd64.iso" \
            "release-assets/bright-os-lite-amd64/bright-os-${VERSION}-lite-amd64.iso" \
            release-assets/SHA256SUMS

          echo "release_url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Release created successfully!"

      - name: Release published
        run: |
          echo ""
          echo "============================================================"
          echo "  RELEASE PUBLISHED"
          echo ""
          echo "  URL: ${{ steps.release.outputs.release_url }}"
          echo "============================================================"
