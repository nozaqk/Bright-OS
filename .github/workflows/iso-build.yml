# =============================================================================
# Bright OS — ISO Build & Validation
#
# Builds a bootable Bright OS ISO using Debian live-build inside a privileged
# debian:trixie container (native trixie debootstrap + live-build avoids
# Ubuntu-host cross-build issues with security suite naming and debootstrap
# scripts). Validates the image (ISO9660, MBR/UEFI, kernel/initrd/squashfs,
# Calamares, key desktop packages), records measurements, and optionally
# attempts a short QEMU TCG boot smoke test.
#
# Triggers:
#   - push to this branch
#   - pull_request targeting main
#   - workflow_dispatch (with edition/version/distro/run_qemu inputs)
# =============================================================================
name: ISO Build

on:
  push:
    branches:
      - 'arena/d6b955d1-bright-os'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition (home, developer, lite)'
        required: false
        default: 'home'
        type: choice
        options: [home, developer, lite]
      version:
        description: 'Version string'
        required: false
        default: '0.1.0-alpha'
        type: string
      distro:
        description: 'Debian codename'
        required: false
        default: 'trixie'
        type: choice
        options: [trixie, bookworm]
      run_qemu:
        description: 'Attempt QEMU TCG boot smoke test (+~10 min)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  BRIGHT_EDITION: home
  BRIGHT_VERSION: 0.1.0-alpha
  BRIGHT_DEBIAN_CODENAME: trixie
  BRIGHT_QEMU_SMOKE: '0'
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-iso:
    name: Build ISO (${{ inputs.edition || 'home' }} / ${{ inputs.distro || 'trixie' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: debian:trixie
      options: --privileged
    outputs:
      iso_name: ${{ steps.build.outputs.iso_name }}
      iso_size: ${{ steps.build.outputs.iso_size }}
      iso_size_human: ${{ steps.build.outputs.iso_size_human }}
      iso_sha256: ${{ steps.build.outputs.iso_sha256 }}
      iso_dir: ${{ steps.build.outputs.iso_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "BRIGHT_EDITION=${{ inputs.edition }}"    >> "$GITHUB_ENV"
          echo "BRIGHT_VERSION=${{ inputs.version }}"    >> "$GITHUB_ENV"
          echo "BRIGHT_DEBIAN_CODENAME=${{ inputs.distro }}" >> "$GITHUB_ENV"
          if [ "${{ inputs.run_qemu }}" = "true" ]; then
            echo "BRIGHT_QEMU_SMOKE=1" >> "$GITHUB_ENV"
          fi

      - name: Record runner/container environment
        run: |
          echo "Container:   $(uname -a)"
          echo "Distro:      $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "Free disk:   $(df -h / | tail -1 | awk '{print $4}')"
          echo "RAM:         $(free -h | awk '/Mem:/ {print $2}')"
          echo "CPU cores:   $(nproc)"
          echo "User:        $(id)"
          echo "PWD:         $(pwd)"

      - name: Write apt sources (trixie) and install build dependencies
        run: |
          set -eux
          # debian:trixie ships with no sources.list (standard for Debian Docker images)
          cat > /etc/apt/sources.list <<'EOF'
          deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring squashfs-tools xorriso \
            isolinux syslinux-common syslinux-efi mtools dosfstools genisoimage \
            grub-pc-bin grub-efi-amd64-bin shim-signed grub-common \
            file coreutils cpio qemu-utils qemu-system-x86 ovmf \
            python3 ca-certificates wget sudo \
            build-essential git rsync
          lb --version
          debootstrap --version
          for t in lb debootstrap mksquashfs xorriso isoinfo file grub-mkstandalone unsquashfs; do
            command -v "$t" >/dev/null || { echo "::error::missing tool: $t"; exit 1; }
          done
          # Show tool versions for the record
          echo "Key package versions:"
          dpkg-query -W -f='${Package}=${Version}\n' live-build debootstrap debian-archive-keyring \
            grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common syslinux-efi shim-signed \
            xorriso squashfs-tools 2>&1 || true

      - name: Sanity-check live-build capabilities and mount
        run: |
          set -eu
          LB_HELP="$(lb config --help 2>&1 || true)"
          for opt in --mode '--architecture|--architectures' '--bootloader|--bootloaders'; do
            echo "$LB_HELP" | grep -qE -- "$opt" \
              && echo "OK: $opt supported" \
              || { echo "::error::live-build missing $opt"; exit 1; }
          done
          # Verify mount works (required for chroot builds)
          echo "--- Testing mount --bind (privileged container capability) ---"
          mkdir -p /tmp/mbind-src /tmp/mbind-dst
          echo "test" > /tmp/mbind-src/test
          mount --bind /tmp/mbind-src /tmp/mbind-dst && echo "mount --bind OK" || {
            echo "::error::mount --bind failed — container must run --privileged"
            exit 1
          }
          grep -q /tmp/mbind-dst /proc/mounts && echo "/proc/mounts shows bind mount"
          umount /tmp/mbind-dst
          rm -rf /tmp/mbind-src /tmp/mbind-dst

      - name: Build ISO
        id: build
        run: |
          set +e
          set +o pipefail
          export BRIGHT_EDITION BRIGHT_VERSION BRIGHT_DEBIAN_CODENAME
          export BRIGHT_ENSURE_VALIDATION=0  # let build.sh exit 0 so artifacts get saved
          OUTPUT_ROOT="${GITHUB_WORKSPACE}/build/output/${BRIGHT_EDITION}"
          BUILD_ROOT=/bright-build
          mkdir -p "$BUILD_ROOT" "$OUTPUT_ROOT"
          # Copy source tree to container-native fs (avoid bind-mount mount/chroot issues)
          echo "Copying source tree to $BUILD_ROOT ..."
          rsync -a --exclude='.git' --exclude='build/output' ./ "$BUILD_ROOT/"
          cd "$BUILD_ROOT"
          LOG="$BUILD_ROOT/build.log"
          BUILD_SUBDIR="$BUILD_ROOT/build/output/${BRIGHT_EDITION}"
          ISO_NAME="bright-os-${BRIGHT_VERSION}-${BRIGHT_EDITION}-amd64.iso"

          echo ""
          echo "Now in: $(pwd)"
          echo "lb version: $(lb --version 2>&1 | head -1)"
          echo ""
          echo "=== Starting live-build ==="
          # Ensure build scripts are executable (rsync may not preserve perms)
          chmod +x build/scripts/*.sh build/live-build/auto/* config/hooks/live/*.chroot editions/*/hooks/*.chroot 2>/dev/null || true
          # Redirect build to log file directly (no tee/grep to avoid SIGPIPE)
          bash -x build/scripts/build.sh \
            --version "$BRIGHT_VERSION" \
            --distro "$BRIGHT_DEBIAN_CODENAME" \
            "$BRIGHT_EDITION" > "$LOG" 2>&1
          BUILD_EXIT=$?
          echo "Build script exited with code: $BUILD_EXIT"

          # Post-build inspection
          echo ""
          echo "=== Build directory listing ($BUILD_ROOT) ==="
          ls -la "$BUILD_ROOT" | head -40
          echo ""
          echo "=== Build subdir ($BUILD_SUBDIR) ==="
          ls -la "$BUILD_SUBDIR" 2>&1 | head -60 || echo "(subdir does not exist)"
          echo ""

          # Locate and inspect ISO
          ISO_FOUND=0
          for iso_dir in "$BUILD_SUBDIR" "$BUILD_ROOT"; do
            if [ -f "$iso_dir/$ISO_NAME" ]; then
              ISO_FOUND=1
              echo "Found ISO at: $iso_dir/$ISO_NAME"
              ls -la "$iso_dir/$ISO_NAME"
              file "$iso_dir/$ISO_NAME" 2>&1 || true
              echo ""
              echo "=== ISO volume descriptor ==="
              isoinfo -d -i "$iso_dir/$ISO_NAME" 2>&1 | head -20 || true
              echo ""
              echo "=== Generating ISO listing (isoinfo -f: full paths one per line) ==="
              isoinfo -i "$iso_dir/$ISO_NAME" -f > "$BUILD_ROOT/iso-listing.txt" 2>&1 || true
              LISTING_LINES=$(wc -l < "$BUILD_ROOT/iso-listing.txt")
              echo "Listing has $LISTING_LINES lines"
              echo ""
              echo "--- First 100 paths of ISO ---"
              head -100 "$BUILD_ROOT/iso-listing.txt"
              echo ""
              echo "--- Paths matching live/boot/EFI/squash/vmlinuz/initrd/grub ---"
              grep -E "^/live/|^/boot|^/EFI|\\.squashfs|^/live$|vmlinuz|initrd|grub|isolinux" "$BUILD_ROOT/iso-listing.txt" | head -80 || echo "(no matches)"
              break
            fi
          done
          if [ "$ISO_FOUND" -eq 0 ]; then
            echo "::warning::ISO NOT FOUND at expected locations"
            echo "--- Searching for any .iso in build tree ---"
            find "$BUILD_ROOT" -name "*.iso" -type f 2>/dev/null | head -20
            echo ""
            echo "--- Searching for vmlinuz/initrd/squashfs ---"
            find "$BUILD_ROOT" -name "vmlinuz*" -o -name "initrd*" -o -name "*.squashfs" 2>/dev/null | head -20
          fi

          # Copy artifacts to workspace OUTPUT_ROOT
          echo ""
          echo "=== Copying artifacts to workspace ==="
          cp -a "$BUILD_ROOT/build.log" "$OUTPUT_ROOT/" 2>/dev/null || true
          cp -a "$BUILD_ROOT/iso-listing.txt" "$OUTPUT_ROOT/" 2>/dev/null || true
          cp -a "$BUILD_SUBDIR/build.log" "$OUTPUT_ROOT/lb-build.log" 2>/dev/null || true
          for iso_dir in "$BUILD_SUBDIR" "$BUILD_ROOT"; do
            if [ -f "$iso_dir/$ISO_NAME" ]; then
              cp -a "$iso_dir/$ISO_NAME" "$OUTPUT_ROOT/"
              cp -a "$iso_dir/${ISO_NAME}.sha256" "$OUTPUT_ROOT/" 2>/dev/null || true
              break
            fi
          done
          # Also copy the inner lb binary config for diagnostics
          mkdir -p "$OUTPUT_ROOT/lb-config"
          for f in config/binary config/bootstrap config/common config/chroot; do
            if [ -f "$BUILD_SUBDIR/$f" ]; then
              cp -a "$BUILD_SUBDIR/$f" "$OUTPUT_ROOT/lb-config/" 2>/dev/null || true
            fi
          done
          cd "$GITHUB_WORKSPACE"

          # Record outputs
          ISO_PATH="$OUTPUT_ROOT/$ISO_NAME"
          if [ -s "$ISO_PATH" ]; then
            ISO_SIZE=$(stat -c%s "$ISO_PATH" 2>/dev/null || echo 0)
            ISO_SHA=$(cut -d' ' -f1 "${ISO_PATH}.sha256" 2>/dev/null || echo "no-sha256")
            ISO_SIZE_HUMAN=$(numfmt --to=iec-i --suffix=B "$ISO_SIZE" 2>/dev/null || echo "${ISO_SIZE}B")
            echo "iso_name=$ISO_NAME"            >> "$GITHUB_OUTPUT"
            echo "iso_dir=$OUTPUT_ROOT"          >> "$GITHUB_OUTPUT"
            echo "iso_path=$ISO_PATH"            >> "$GITHUB_OUTPUT"
            echo "iso_size=$ISO_SIZE"            >> "$GITHUB_OUTPUT"
            echo "iso_size_human=$ISO_SIZE_HUMAN" >> "$GITHUB_OUTPUT"
            echo "iso_sha256=$ISO_SHA"           >> "$GITHUB_OUTPUT"
            echo "::notice::Built: $ISO_PATH ($ISO_SIZE_HUMAN)"
            echo "::notice::SHA256: $ISO_SHA"
          else
            echo "::warning::ISO file not present/size 0 at $ISO_PATH"
            ls -la "$OUTPUT_ROOT" "$BUILD_SUBDIR" 2>&1 | head -30
          fi

          if [ "$BUILD_EXIT" -ne 0 ] && [ "$ISO_FOUND" -eq 0 ]; then
            echo "::error::build.sh exited with code $BUILD_EXIT and no ISO produced"
            exit "$BUILD_EXIT"
          elif [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::warning::build.sh exited with code $BUILD_EXIT but ISO was produced; continuing to validation"
          fi

      - name: Dump tail of build log (for debugging)
        if: always()
        run: |
          set +e
          cd "build/output/${BRIGHT_EDITION}"
          LOG="build.log"
          LB_LOG="lb-build.log"
          ISO_NAME="bright-os-${BRIGHT_VERSION}-${BRIGHT_EDITION}-amd64.iso"
          echo "=== Build log size: $(wc -c < "$LOG" 2>/dev/null || echo 0) bytes ==="
          if [ -f "$LOG" ]; then
            echo "--- Last 80 lines of build.log ---"
            tail -80 "$LOG"
            echo ""
            echo "--- Key E: / ERROR / FAIL lines ---"
            grep -nE "E: |ERROR|FAIL|error:|failed|unrecognized|Unknown|not found|invalid|cannot" "$LOG" | tail -30 || echo "(no error lines found)"
          else
            echo "(no build.log found)"
          fi
          if [ -f "$LB_LOG" ]; then
            echo ""
            echo "--- Last 80 lines of lb-build.log ---"
            tail -80 "$LB_LOG"
            echo ""
            echo "--- Key E: lines from lb-build.log ---"
            grep -nE "^E: |^P: |^W: |ERROR|FAIL|failed|unrecognized|not found" "$LB_LOG" | tail -40 || echo "(none)"
          fi
          echo ""
          echo "=== Direct isoinfo inspection of $ISO_NAME ==="
          if [ -f "$ISO_NAME" ]; then
            echo "--- file command on ISO ---"
            file "$ISO_NAME"
            echo ""
            # Save full listing
            isoinfo -f -i "$ISO_NAME" > iso-paths.txt 2>&1
            TOTAL_PATHS=$(wc -l < iso-paths.txt)
            echo "::notice::Total paths in ISO: $TOTAL_PATHS"
            echo ""
            echo "::notice::=== First 60 paths ==="
            head -60 iso-paths.txt | while IFS= read -r ln; do echo "::notice::  $ln"; done
            echo ""
            echo "::notice::=== Paths with live/squash/vmlinuz/initrd ==="
            grep -iE "squashfs|vmlinuz|initrd|live" iso-paths.txt | head -20 | while IFS= read -r ln; do echo "::notice::  $ln"; done
            echo ""
            echo "::notice::=== Paths with boot/grub/EFI/isolinux ==="
            grep -iE "boot|grub|efi|isolinux" iso-paths.txt | head -20 | while IFS= read -r ln; do echo "::notice::  $ln"; done
          else
            echo "(no ISO file found)"
            ls -la
          fi
          cd "$GITHUB_WORKSPACE"
          if [ -f "build/output/${BRIGHT_EDITION}/iso-listing.txt" ]; then
            echo ""
            echo "=== Saved iso-listing.txt (first 100 lines) ==="
            head -100 "build/output/${BRIGHT_EDITION}/iso-listing.txt"
          fi

      - name: Run extended ISO validation
        if: steps.build.outputs.iso_path
        run: |
          set +e
          cd "${{ steps.build.outputs.iso_dir }}"
          echo "=== validate-iso.sh output ==="
          bash "${GITHUB_WORKSPACE}/build/scripts/validate-iso.sh" \
            "${{ steps.build.outputs.iso_name }}" 2>&1 | tee validation.log
          VAL_EXIT=$?
          echo "validate-iso.sh exit: $VAL_EXIT"
          echo ""
          echo "=== Content checks (extended) ==="
          LISTING=$(mktemp)
          # Use isoinfo -f (full paths, one per line) for reliable grep matching
          isoinfo -i "${{ steps.build.outputs.iso_name }}" -f > "$LISTING" 2>&1 || true
          echo "--- ISO path listing (first 80 lines) ---"
          head -80 "$LISTING"
          failures=0
          check() {
            local pat="$1" desc="$2" req="${3:-1}"
            if grep -qiE "$pat" "$LISTING"; then  # ISO 9660 names are upper case
              echo "  [PASS] $desc"
            else
              if [ "$req" = "1" ]; then
                echo "  [FAIL] $desc"; failures=$((failures+1))
              else
                echo "  [WARN] $desc (optional, not found)"
              fi
            fi
          }
          # ISO-level files only. Package contents inside filesystem.squashfs are
          # checked by build.sh against the unpacked tree.
          check '/live/vmlinuz'                 'Linux kernel'
          check '/live/initrd'                  'initrd'
          check '/live/filesystem\.squashfs'    'Root filesystem (squashfs)'
          check 'boot/grub/'                    'GRUB bootloader'
          check 'EFI/boot/bootx64\.efi|efi\.img' 'UEFI boot binary'
          check 'isolinux/'                     'ISOLINUX (BIOS)' 0
          if [ "$failures" -gt 0 ]; then
            echo ""
            echo "::warning::$failures extended content check(s) failed; continuing for diagnostics."
            echo "--- Paths containing live/boot/EFI/squash ---"
            grep -E "live/|/live$|/boot|EFI|efi|\\.squashfs|vmlinuz|initrd|grub" "$LISTING" | head -40 || echo "(none)"
          else
            echo "Extended content checks passed."
          fi
          rm -f "$LISTING"

      - name: Extract package manifest from squashfs
        if: steps.build.outputs.iso_path
        run: |
          set +e
          cd "${{ steps.build.outputs.iso_dir }}"
          mkdir -p manifest
          # Find the actual squashfs path in the ISO (it might have a numbered prefix)
          SQUASHFS_PATH=$(isoinfo -i "${{ steps.build.outputs.iso_name }}" -f 2>/dev/null | grep -E '\.squashfs$' | head -1)
          if [ -z "$SQUASHFS_PATH" ]; then
            echo "::warning::No .squashfs found in ISO; skipping manifest."
            exit 0
          fi
          echo "Extracting $SQUASHFS_PATH from ISO..."
          xorriso -osirrox on -indev "${{ steps.build.outputs.iso_name }}" \
            -extract "$SQUASHFS_PATH" ./filesystem.squashfs 2>&1 | tail -5
          if [ ! -s ./filesystem.squashfs ]; then
            echo "::warning::filesystem.squashfs could not be extracted; skipping manifest."
            exit 0
          fi
          echo "Squashfs size: $(stat -c%s ./filesystem.squashfs) bytes"
          unsquashfs -d ./squashfs-root -e /var/lib/dpkg/status ./filesystem.squashfs \
            >/dev/null 2>&1 || true
          STATUS_FILE=./squashfs-root/var/lib/dpkg/status
          if [ -f "$STATUS_FILE" ]; then
            python3 "${GITHUB_WORKSPACE}/tools/ci/extract_manifest.py" \
              "$STATUS_FILE" ./manifest
          else
            echo "::warning::dpkg/status not found in squashfs; skipping manifest."
            ls -la ./squashfs-root/ 2>&1 | head
          fi

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bright-os-${{ env.BRIGHT_VERSION }}-${{ env.BRIGHT_EDITION }}-amd64
          path: |
            build/output/${{ env.BRIGHT_EDITION }}/*.iso
            build/output/${{ env.BRIGHT_EDITION }}/*.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs and measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ env.BRIGHT_EDITION }}-${{ github.run_id }}
          path: |
            build/output/${{ env.BRIGHT_EDITION }}/build.log
            build/output/${{ env.BRIGHT_EDITION }}/lb-build.log
            build/output/${{ env.BRIGHT_EDITION }}/iso-listing.txt
            build/output/${{ env.BRIGHT_EDITION }}/validation.log
            build/output/${{ env.BRIGHT_EDITION }}/build-measurement.json
            build/output/${{ env.BRIGHT_EDITION }}/manifest/packages.txt
            build/output/${{ env.BRIGHT_EDITION }}/lb-config/*
          if-no-files-found: warn
          retention-days: 30
