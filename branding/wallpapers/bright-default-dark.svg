<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Bright OS Default Dark Wallpaper -->
  <!-- Clean dark background with subtle blue-violet gradient accent (top-right) -->
  <!-- Matches Bright Design System Dark theme base (#0a0e1a) -->
  <defs>
    <radialGradient id="bgGrad" cx="85%" cy="15%" r="70%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.6"/>
      <stop offset="35%" style="stop-color:#1a1f3d;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0a0e1a;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="88%" cy="12%" r="25%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.18"/>
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0a0e1a;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bottomAccent" cx="15%" cy="90%" r="40%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#0a0e1a;stop-opacity:0"/>
    </radialGradient>
    <!-- Subtle grid pattern (very faint) -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base dark color -->
  <rect width="3840" height="2160" fill="#0a0e1a"/>

  <!-- Background gradient -->
  <rect width="3840" height="2160" fill="url(#bgGrad)"/>

  <!-- Faint grid -->
  <rect width="3840" height="2160" fill="url(#grid)" opacity="0.4"/>

  <!-- Accent glow top-right (Brand blue) -->
  <rect width="3840" height="2160" fill="url(#accentGlow)"/>

  <!-- Bottom violet accent -->
  <rect width="3840" height="2160" fill="url(#bottomAccent)"/>

  <!-- Bright OS logo mark - subtle, centered-bottom area -->
  <g transform="translate(3360, 200)" opacity="0.08">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#3b82f6" stroke-width="6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#93c5fd"/>
  </g>
</svg>
