<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Bright OS Default Light Wallpaper -->
  <!-- Clean light background with subtle blue gradient accent -->
  <!-- Matches Bright Design System Light theme base (#f8fafc) -->
  <defs>
    <radialGradient id="bgGradLight" cx="80%" cy="10%" r="75%">
      <stop offset="0%" style="stop-color:#dbeafe;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#e0e7ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="accentGlowLight" cx="85%" cy="10%" r="25%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.12"/>
      <stop offset="60%" style="stop-color:#6366f1;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bottomAccentLight" cx="10%" cy="90%" r="45%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0"/>
    </radialGradient>
    <pattern id="gridLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Base light color -->
  <rect width="3840" height="2160" fill="#f8fafc"/>

  <!-- Background gradient -->
  <rect width="3840" height="2160" fill="url(#bgGradLight)"/>

  <!-- Faint grid -->
  <rect width="3840" height="2160" fill="url(#gridLight)" opacity="0.3"/>

  <!-- Accent glow top-right -->
  <rect width="3840" height="2160" fill="url(#accentGlowLight)"/>

  <!-- Bottom violet accent -->
  <rect width="3840" height="2160" fill="url(#bottomAccentLight)"/>

  <!-- Subtle brand mark -->
  <g transform="translate(3360, 200)" opacity="0.06">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#3b82f6" stroke-width="6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#6366f1" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#3b82f6"/>
  </g>
</svg>
