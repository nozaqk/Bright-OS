# =============================================================================
# AURA Core Configuration
# Bright OS native intelligence and cybersecurity platform
#
# This file contains default settings. An administrator can override by
# editing /etc/bright-os/aura/aura.conf. All settings have safe defaults.
# =============================================================================

[core]
# Logging level: debug, info, warning, error
log_level = info
# Maximum restart attempts for a failed component before permanent failure
component_restart_limit = 5
# Seconds to wait between restart attempts
component_restart_delay = 3

[intelligence]
# ---------------------------------------------------------------------------
# AI operating mode: local, hybrid, offline
#   local   — local models only (default, no network)
#   hybrid  — local default + cloud only with explicit per-request consent
#   offline — no network at all (even model downloads blocked)
# Mode can be changed at runtime via D-Bus; no reinstall required.
# ---------------------------------------------------------------------------
mode = local

# Preferred provider: auto, llamacpp, ollama, none
provider = auto

# Default model to lazy-load on first inference (if set).
# Models are NEVER loaded at boot regardless of this setting.
default_model =

# Model weights directory (models are NOT bundled in the ISO; place or
# download GGUF files here).
model_dir = /var/lib/aura/models

# ---------------------------------------------------------------------------
# Resource policy (Adaptive Resource Manager)
# ---------------------------------------------------------------------------
# Hard RAM cap in MB for inference. 0 = use max_memory_percent.
max_memory_mb = 0
# Cap inference RAM at this percent of total system RAM.
max_memory_percent = 50
# CPU threads for inference. 0 = auto (leaves 1 core for desktop).
cpu_threads = 0
# Unload a loaded model after this many idle seconds.
# 0 = disable idle unloading. Negative values also disable.
unload_idle_seconds = 600
# Lazy-load model on first inference (true = never load at boot)
lazy_load = true
# Never automatically load a large model at boot, even if default_model is set
auto_load_at_boot = false
# Battery threshold (%); below this, switch to conservative policy on laptops
battery_low_threshold = 20
# Maximum context window size in tokens
max_context_tokens = 8192

# ---------------------------------------------------------------------------
# Cloud (hybrid mode only) — disabled by default; consent required per call
# ---------------------------------------------------------------------------
cloud_endpoint =
# Command whose stdout is the API key (no shell). E.g. `secret-tool lookup ...`
# Prefer this over storing keys in plaintext.
cloud_api_key_command =
# Path to a 0600 file containing the API key (fallback)
cloud_api_key_file =
# Require explicit interactive consent before each cloud call
require_consent = true
# If true, cloud is enabled once a key is configured (still requires consent
# unless require_consent is false; not recommended)
allow_cloud_default = false

# Telemetry is always disabled; this flag exists for documentation.
enable_telemetry = false

# Edition profile: auto (detected), home, developer, lite
edition_profile = auto

[security]
enabled = true
file_integrity_check = true
process_monitoring = true
network_monitoring = true
# Allow autonomous emergency isolation (default off; requires opt-in)
auto_isolate = false
# Log security events
audit_log = true

[memory]
enabled = true
max_entries = 10000
retention_days = 90

[recovery]
enabled = true
backup_dir = /var/lib/aura/backups
max_backups = 10
