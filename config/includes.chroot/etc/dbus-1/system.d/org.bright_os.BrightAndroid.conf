<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Bright Android management service (session bus for UI, system bus
       for privileged helper). The main service runs on the SESSION bus as
       the logged-in user; this config is for privileged helpers. -->

  <policy user="root">
    <allow own="org.bright_os.BrightAndroid"/>
    <allow send_destination="org.bright_os.BrightAndroid"/>
    <allow receive_sender="org.bright_os.BrightAndroid"/>
  </policy>

  <!-- Any user can talk to the system service for status queries -->
  <policy context="default">
    <allow send_destination="org.bright_os.BrightAndroid"
           send_member="GetVersion"/>
    <allow send_destination="org.bright_os.BrightAndroid"
           send_member="GetCompatibilityReport"/>
    <allow send_destination="org.bright_os.BrightAndroid"
           send_member="GetStatus"/>
    <deny send_destination="org.bright_os.BrightAndroid"/>
  </policy>
</busconfig>
