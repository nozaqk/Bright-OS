<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- AURA Core runs as 'aura' user and owns the org.bright_os.AURA name -->
  <policy user="aura">
    <allow own="org.bright_os.AURA"/>
    <allow send_destination="org.bright_os.AURA"/>
    <allow receive_sender="org.bright_os.AURA"/>
    <!-- The service can send signals to anyone -->
    <allow send_type="signal"/>
  </policy>

  <!-- root can always communicate with AURA -->
  <policy user="root">
    <allow send_destination="org.bright_os.AURA"/>
    <allow receive_sender="org.bright_os.AURA"/>
  </policy>

  <!-- Logged-in desktop sessions may call status methods and user-initiated
       operations. Privileged operations (Shutdown, GrantCloudConsent) are
       allowed through to the service, which performs a Polkit authorization
       check using the action ids defined in org.bright_os.AURA.policy. -->
  <policy context="default">
    <!-- Read-only / status methods -->
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetVersion"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetStatus"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetServiceInfo"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="ListComponents"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetComponentStatus"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetAllComponentStatus"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="IsComponentHealthy"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetAIMode"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="ListAIModels"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="ListAIProviders"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetActiveAIProvider"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetLoadedModel"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetHardwareSuitability"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetResourceUsage"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetInferenceStatus"/>

    <!-- User-initiated AI actions (no system-wide side effects) -->
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="SetAIMode"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="LoadAIModel"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="UnloadAIModel"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="CancelInference"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="CancelAllInference"/>

    <!-- Privileged operations — allowed through the bus; the service
         performs a Polkit check (org.bright_os.AURA.shutdown,
         org.bright_os.AURA.grant-cloud-consent) before executing. -->
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="Shutdown"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GrantCloudConsent"/>

    <!-- Receiving signals from AURA is allowed to any client -->
    <allow receive_sender="org.bright_os.AURA"
           receive_type="signal"/>
  </policy>
</busconfig>
