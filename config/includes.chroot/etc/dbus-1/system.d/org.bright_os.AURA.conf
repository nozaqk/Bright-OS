<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- AURA Core runs as 'aura' user and owns the org.bright_os.AURA name -->
  <policy user="aura">
    <allow own="org.bright_os.AURA"/>
    <allow send_destination="org.bright_os.AURA"/>
    <allow receive_sender="org.bright_os.AURA"/>
  </policy>

  <!-- root can always communicate with AURA -->
  <policy user="root">
    <allow send_destination="org.bright_os.AURA"/>
    <allow receive_sender="org.bright_os.AURA"/>
  </policy>

  <!-- Logged-in desktop users can call AURA methods (read status, send commands) -->
  <!-- Privileged operations (shutdown, config changes) require Polkit -->
  <policy context="default">
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetVersion"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetStatus"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetServiceInfo"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="ListComponents"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetComponentStatus"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetAllComponentStatus"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="IsComponentHealthy"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="GetAIMode"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="SecurityAlert"/>
    <allow send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="ComponentStateChanged"/>
    <!-- Shutdown requires auth (Polkit) -->
    <deny  send_destination="org.bright_os.AURA"
           send_interface="org.bright_os.AURA"
           send_member="Shutdown"/>
  </policy>
</busconfig>
