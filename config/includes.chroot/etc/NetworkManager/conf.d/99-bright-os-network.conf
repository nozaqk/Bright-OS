# Bright OS NetworkManager configuration
# Optimized for desktop use with automatic connectivity checking

[main]
dns=default
plugins=keyfile
configure-and-quit=no

[connectivity]
uri=http://network-test.debian.org/nm
interval=300
response=NetworkManager is online
enabled=true

[device]
wifi.scan-rand-mac-address=yes
wifi.backend=iwd

[keyfile]
unmanaged-devices=none
