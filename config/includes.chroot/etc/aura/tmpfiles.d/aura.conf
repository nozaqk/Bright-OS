# tmpfiles.d configuration for AURA subsystem
# Creates state and log directories with correct ownership/permissions.

# Type  Path                         Mode UID  GID  Age Argument
d     /var/lib/aura                 0750 aura aura -   -
d     /var/lib/aura/backups         0750 aura aura -   -
d     /var/log/aura                 0750 aura adm  -   -
d     /etc/bright-os/aura           0755 root root -   -
