# Calamares Finished Module for Bright OS
# Shows final screen after installation completes

# Offer to restart now or continue testing in live mode
restartNowEnabled: true
restartNowChecked: false
restartNowCommand: "systemctl -i reboot"

# Do not show a custom finished URL — show the standard restart message
finishedUrl: ""

# Message shown during finalization
finalizingMessage: "Finalizing Bright OS installation..."
