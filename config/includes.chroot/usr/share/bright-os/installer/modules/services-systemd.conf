# Calamares Services Module
# Enables/disables systemd services in the installed system

services:
    - name: "NetworkManager.service"
      mandatory: false
    - name: "sddm.service"
      mandatory: true
    - name: "firewalld.service"
      mandatory: false
    - name: "cups.service"
      mandatory: false
    - name: "bluetooth.service"
      mandatory: false
    - name: "udisks2.service"
      mandatory: true
    - name: "upower.service"
      mandatory: false
    - name: "bright-os-firstboot.service"
      mandatory: true
    - name: "systemd-timesyncd.service"
      mandatory: false

targets:
    - name: "graphical.target"
      mandatory: true

# Disable the live autologin config (we'll write proper config in postcfg)
disable:
    - name: "bright-os-live.service"  # if exists
      mandatory: false
