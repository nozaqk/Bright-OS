# GRUB configuration module for Calamares (Bright OS)
# Configures /etc/default/grub after installation.
#
# Key settings for Debian Trixie + LUKS support:
# - GRUB_ENABLE_CRYPTODISK=y allows GRUB to unlock LUKS2 partitions at boot
# - GRUB_DISTRIBUTOR set to "Bright OS" for consistent boot menu branding
# - Quiet boot with Plymouth splash; recovery options kept available

# Don't completely overwrite /etc/default/grub — only set these keys
# (preserves any existing Debian defaults).
overwrite: false

# GRUB defaults to set
grubDefaults:
    GRUB_TIMEOUT: "5"
    GRUB_TIMEOUT_STYLE: "menu"
    GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash systemd.show_status=0 vt.global_cursor_default=0"
    GRUB_CMDLINE_LINUX: ""
    GRUB_ENABLE_CRYPTODISK: "y"
    GRUB_DISABLE_OS_PROBER: "false"
    GRUB_RECORDFAIL_TIMEOUT: "5"
    # Use GRUB graphics mode for Plymouth
    GRUB_GFXMODE: "auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"

# Distributor string (shown in GRUB menu entries and os-prober)
grubDistributor: "Bright OS"

# Use the Bright OS GRUB theme if installed
# (Theme is installed by the branding hook to /boot/grub/themes/bright-os/)
grubTheme: "/boot/grub/themes/bright-os/theme.txt"
