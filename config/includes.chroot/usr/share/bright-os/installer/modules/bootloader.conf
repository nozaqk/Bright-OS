# Calamares Bootloader Module Configuration for Bright OS
# Configures GRUB bootloader installation

# Install to MBR or EFI automatically based on system boot mode
# "none" means we don't pre-set; user chooses in UI. But for EFI installs,
# we need to configure properly.
# We let Calamares auto-detect EFI vs BIOS and install appropriately.

# EFI configuration
efiBootLoader: "grubx64.efi"
# Install GRUB to the standard Debian EFI path to ensure os-prober and
# grub updates work correctly. Use "debian" as the bootloader-id for
# compatibility with existing GRUB installations in dual-boot setups.
# (We still brand GRUB via theme and os-release)
efiBootLoaderId: "BrightOS"
efiBootLoaderPath: "/EFI/BrightOS/grubx64.efi"

# GRUB configuration
grubCfgPath: "/boot/grub/grub.cfg"
grubUseCryptodisk: true

# Kernel command line
kernelLine: "quiet splash systemd.show_status=0 vt.global_cursor_default=0"
fallbackKernelLine: "systemd.show_status=1"

# Install GRUB MBR boot code
installFrom: "/usr/lib/grub/"
# Run update-grub after install
update: true
keepLinuxUpdate: true

# Do NOT set installPath to a fixed device — let Calamares choose
# based on the EFI system partition or selected boot disk.
# installPath is left unset so user can choose in the UI.
# For automated installs, we set it to "any" which means the disk
# containing /boot.
installPath: "any"

# Prefer GPT with BIOS boot partition or MBR
# Calamares handles this automatically based on how the user partitioned.
