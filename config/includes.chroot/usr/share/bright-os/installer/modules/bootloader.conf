# Calamares Bootloader Module
# Configures GRUB bootloader installation

# Location to install GRUB to
# Can be "any" to let the user choose a disk, or a specific device
# e.g., "/dev/sda" to force installation to a specific device
installPath: "any"

# Use EFI if the live system booted via EFI
efiBootLoader: "grubx64.efi"
# Full path to EFI bootloader
efiBootLoaderPath: "/EFI/bright/grubx64.efi"
# GRUB EFI directory name
grubInstallName: "bright"

# Will use os-prober to find other operating systems
grubConfPath: "/boot/grub/grub.cfg"
grubUseCryptodisk: true
# Add "quiet splash" to kernel command line
kernelLine: "quiet splash"
# Fallback kernel line (recovery mode)
fallbackKernelLine: "systemd.show_status=1"
# Preload/install GRUB MBR
installFrom: "/usr/lib/grub/"
# Run update-grub after install
update: true
# Keep existing GRUB configuration
keepLinuxUpdate: true
