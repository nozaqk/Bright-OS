# Calamares fstab Module
# Generates /etc/fstab for the installed system

# Filesystem mount options
defaultMountOptions: defaults
btrfsMountOptions: defaults,subvol=@,compress=zstd,noatime
efiMountOptions: defaults,noatime
crypttabOptions: luks,keyscript=decrypt_keyctl
# Write /tmp as tmpfs
tmpOptions: defaults,noatime,mode=1777
tmpSize: 4G
# Extra mounts
extraMounts: []
# Add SSD mount options automatically
ssdExtraMountOptions:
    ext4: discard
    btrfs: discard,ssd
    f2fs: discard
    xfs: discard
