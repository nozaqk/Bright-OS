# Calamares fstab Module Configuration for Bright OS
# Generates /etc/fstab for the installed system (Debian Trixie compatible).
#
# NOTE: crypttabOptions uses plain "luks" without keyscript= because
# keyscript=decrypt_keyctl is DEPRECATED in cryptsetup-initramfs 2.7+
# (Debian Trixie). Using keyscript on Trixie causes initramfs to fail
# building, resulting in an unbootable encrypted system. The luksbootkeyfile
# module + initramfscfg handle keyfile-based unlocking correctly for LUKS.

# Default mount options for root filesystem
defaultMountOptions: defaults

# Btrfs default mount options (used if user selects btrfs).
# Note: we do NOT force subvol=@ here because Calamares does not create
# subvolumes automatically. Users doing manual btrfs partitioning set
# their own subvolumes.
btrfsMountOptions: defaults,compress=zstd,noatime

# EFI System Partition mount options
efiMountOptions: defaults,noatime,fmask=0077,dmask=0077

# Crypttab options for LUKS devices.
# Plain "luks" without keyscript — systemd-cryptsetup/plymouth handle passphrase.
# The luksbootkeyfile module adds a keyfile for automatic unlock after GRUB.
crypttabOptions: luks

# Mount /tmp as tmpfs (optional, commented out as it can cause issues with
# low-RAM systems; Debian handles /tmp via systemd tmpfiles by default)
# tmpOptions: defaults,noatime,mode=1777
# tmpSize: 4G

# Extra mounts (none by default)
extraMounts: []

# SSD mount options.
# NOTE: We do NOT add "discard" (continuous TRIM) — it is not recommended
# for modern SSDs. Instead, we enable fstrim.timer in services-systemd.conf
# which performs weekly TRIM safely.
ssdExtraMountOptions:
    ext4: noatime,errors=remount-ro
    btrfs: noatime,ssd,compress=zstd
    f2fs: noatime
    xfs: noatime

# Create /home on a separate partition by default (when using erase+autopartition)
# Not enforced here — Calamares partition module handles layout.
