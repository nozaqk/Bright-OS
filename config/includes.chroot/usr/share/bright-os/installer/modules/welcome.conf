# Calamares Welcome Module Config
# Displayed first: language selection, release notes, requirements check

welcomeStyle: "Welcome to Bright OS!"

# Url for the release notes page shown in the welcome screen
releaseNotesUrl: "https://github.com/nozaqk/Bright-OS/releases/tag/v0.1.0-alpha"
# Url for support link
supportUrl: "https://github.com/nozaqk/Bright-OS/issues"

# Known issues URL
knownIssuesUrl: "https://github.com/nozaqk/Bright-OS/issues"

# Donate URL (optional)
# donateUrl: ""

# Requirements to check before allowing installation
requirements:
    # Check for required RAM
    - name: ram
      required: true
      enumeration: 1024
      type: ram
    # Check for enough disk space
    - name: storage
      required: true
      enumeration: 10
      type: storage
    # Check internet (not strictly required for offline install)
    - name: internet
      required: false
      type: internet
    # Check root privileges
    - name: root
      required: true
      type: check
    # Check for plugged-in power on laptops
    - name: power
      required: false
      type: power
    # Check if running in a VM (warning only)
    - name: VM
      required: false
      type: check
