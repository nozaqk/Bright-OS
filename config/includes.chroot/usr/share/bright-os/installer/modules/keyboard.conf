# Calamares Keyboard Module
# Configures keyboard layout during installation

# Write keyboard configuration to these places
keyboardModel: "pc105"
xkbVariant: ""
keyboardLayout: "us"
# Write to /etc/default/keyboard for Debian
writeEtcDefaultKeyboard: true
writeEtcDefaultKeyboardPath: "/etc/default/keyboard"
# Also use locale1 dbus service for live session
configureKeyboard: true
