# Calamares Partition Module Configuration for Bright OS
# Disk partitioning configuration for both automatic and manual installs.
# Supports: UEFI/GPT, BIOS/MBR, dual-boot, manual partitioning, LUKS encryption.

# Default initial installation choice shown to user.
# "none" = show all options; user must choose. Never auto-select "erase".
# This ensures automatic disk erasure only happens with explicit user action.
initialPartitioningChoice: none
initialSwapChoice: none

# Default filesystem type for new installations
defaultFileSystemType: "ext4"

# Allow manual partitioning (required for advanced users and dual-boot)
allowManualPartitioning: true

# Show the partition layout chooser (alongside/erase/replace options)
partitionLayoutChooser: true

# Always draw partition previews
drawNestedPartitions: false

# --- EFI System Partition ---
# Minimum size 300MB (Debian recommendation; 512MB is safer but 300MB works)
efiSystemPartitionSize: 512MiB
efiSystemPartitionName: "EFI System Partition"
efiSystemPartitionSizeMinimum: 300
# EFI partition mount point
efiSystemPartition: "/boot/efi"

# --- Required Sizes ---
# Minimum root partition size (8GB base install; 16GB recommended per settings.conf)
requiredSpacePartition: 8192
requiredSpacePartitionReplacement: 8192

# --- Swap Size Recommendations ---
# Swap sizes following standard Linux recommendations
swapSize:
    - memory: 0
      size: 2048
    - memory: 2048
      size: 2048
    - memory: 4096
      size: 4096
    - memory: 8192
      size: 4096
    - memory: 16384
      size: 8192
    - memory: 65536
      size: 16384

# --- Available Filesystems ---
availableFileSystemTypes:
    - "ext4"
    - "btrfs"
    - "xfs"
    - "f2fs"

# --- LUKS Encryption ---
# Enable LUKS encryption option in automatic partitioning
enableLuksAutomatedPartitioning: true

# --- Automatic Partitioning Layout ("erase disk" option) ---
# Creates: EFI System Partition + ext4 root (no separate /boot needed
# since GRUB_ENABLE_CRYPTODISK=y in grubcfg allows GRUB to unlock LUKS2).
# For BIOS/MBR systems, the EFI entry is ignored.
partitionLayout:
    - name: "EFI System Partition"
      type: efi
      filesystem: "fat32"
      mountPoint: "/boot/efi"
      size: 512MiB
      attributes: 0
      features:
        - "boot"
        - "esp"
    - name: "Bright OS"
      type: normal
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
      minSize: 12288MiB
      attributes: 0

# --- Safety Checks ---
# Require user to explicitly confirm destructive operations.
# Never erase a disk without explicit user selection (handled by initialPartitioningChoice: none).
