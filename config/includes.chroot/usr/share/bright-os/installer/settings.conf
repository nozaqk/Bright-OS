# Bright OS Calamares Installer Settings
# Main configuration file for the Calamares installer (3.3.x for Debian Trixie)
#
# Module ordering follows the official Calamares LUKS deployment guide:
#   https://calamares.codeberg.page/docs/deploy-luks/
# and is validated against Debian Trixie's calamares 3.3.14.
#
# Correct sequence for Debian with LUKS support:
#   partition -> mount -> unpackfs -> machineid -> fstab -> locale -> keyboard
#   -> localecfg -> luksbootkeyfile -> users -> displaymanager -> networkcfg
#   -> hwclock -> services-systemd -> packages (remove live-*) -> initramfscfg
#   -> initramfs -> grubcfg -> bootloader -> shellprocess-post -> umount
#
# Key notes for Debian Trixie:
# - displaymanager module configures SDDM (required for installed system)
# - packages must remove live-boot* BEFORE initramfs runs
# - luksbootkeyfile + initramfscfg enable LUKS unlocking without double password
# - umount is required to cleanly unmount target before reboot
# - shellprocess-post runs our custom post-install cleanup script
# - crypttab keyscript= is DEPRECATED in cryptsetup 2.7+ (Trixie) and must NOT be used

modules-search:
    - /usr/lib/x86_64-linux-gnu/calamares/modules
    - /etc/calamares/modules
    - /usr/share/calamares/modules

# Module instances (custom shellprocess for post-install)
instances:
    - id: shellprocess-post
      module: shellprocess
      config: shellprocess-post.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - luksbootkeyfile
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - packages
        - initramfscfg
        - initramfs
        - grubcfg
        - bootloader
        - shellprocess-post
        - umount
    - show:
        - finished

# Branding
branding: bright-os

# Window sizing
window-size:
    width:  1024
    height: 700

# Install confirmation
prompt-install: true

# Debugging
debug: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true

# Minimum requirements (suitable for Debian Trixie + Bright Desktop)
required-space: 16GB
required-ram: 2048
