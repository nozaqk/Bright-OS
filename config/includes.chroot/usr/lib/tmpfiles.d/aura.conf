# tmpfiles.d configuration for AURA subsystem
# Creates state and log directories with correct ownership/permissions.
# Applied automatically by systemd-tmpfiles at boot and package install.
#
# Install to /usr/lib/tmpfiles.d/aura.conf (standard path, picked up
# automatically by systemd-tmpfiles --create without explicit path args).

# Type  Path                         Mode UID  GID  Age Argument
d     /var/lib/aura                 0750 aura aura -   -
d     /var/lib/aura/backups         0750 aura aura -   -
d     /var/lib/aura/models          0750 aura aura -   -
d     /var/lib/aura/conversations   0700 aura aura -   -
d     /var/log/aura                 0750 aura adm  -   -
d     /etc/bright-os/aura           0755 root root -   -
