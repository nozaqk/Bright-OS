# sysusers.d entry for the greetd greeter user.
# The greeter runs cage + gtkgreet; it needs membership in 'video', 'input',
# and 'render' groups to access DRM/input devices. The shell must be a real
# shell (not /usr/sbin/nologin) because greetd invokes the user's shell to
# start the session command.
u greeter - "Bright OS greeter user" /var/lib/greeter /bin/bash
m greeter video
m greeter input
m greeter render
