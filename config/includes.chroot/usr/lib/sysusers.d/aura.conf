# sysusers.d configuration for AURA subsystem
# Creates a dedicated 'aura' system user/group for running the AURA service.
# The service does NOT run as root. Privileged operations use Polkit.
#
# Install to /usr/lib/sysusers.d/aura.conf so systemd-sysusers picks it up
# automatically at boot and during package installation.

# Type  Name    ID  GECOS                        Home directory     Shell
u     aura    -   "Bright OS AURA Assistant"   /var/lib/aura      /usr/sbin/nologin
g     aura    -
m     aura    aura
