# Bright OS GRUB Boot Menu Configuration
# Provides boot options for the live system and installer

set default=0
set timeout=10
set gfxpayload=keep

# Load graphics modules
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod vbe
    insmod vga
    insmod gfxterm
    terminal_output gfxterm
fi

# Bright OS colors
set menu_color_normal=white/black
set menu_color_highlight=black/light-blue
set color_normal=white/black
set color_highlight=black/light-blue

# Bright OS header
if [ "${grub_platform}" = "efi" ]; then
    echo " "
    echo "  ╔══════════════════════════════════════╗"
    echo "  ║       BRIGHT OS - Alpha 0.1         ║"
    echo "  ║   Linux for developers & makers     ║"
    echo "  ╚══════════════════════════════════════╝"
    echo " "
fi

menuentry "Bright OS Live (Default)" --class bright-os --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live quiet splash systemd.show_status=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}

menuentry "Bright OS Live (Safe Graphics)" --class bright-os --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live nomodeset xforcevesa quiet splash
    initrd /live/initrd.img
}

menuentry "Bright OS Live (No Splash, Verbose)" --class bright-os --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live systemd.show_status=1
    initrd /live/initrd.img
}

menuentry "Bright OS Live (Recovery Mode)" --class bright-os --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live nox11autologin nopersistence debug
    initrd /live/initrd.img
}

menuentry "Memory Test (memtest86+)" --class memtest {
    linux /live/memtest
}

menuentry "Boot from first hard disk" --class os {
    insmod chain
    set root=(hd0)
    chainloader +1
}

submenu "Advanced options..." {
    menuentry "Bright OS Live (Force UEFI)" --class bright-os {
        set gfxpayload=keep
        linux /live/vmlinuz boot=live quiet splash efi=runtime
        initrd /live/initrd.img
    }
    
    menuentry "Bright OS Live (BIOS Compatibility)" --class bright-os {
        set gfxpayload=keep
        linux /live/vmlinuz boot=live noapic noapm nodma nomce nolapic nomodeset nosmp
        initrd /live/initrd.img
    }
}
