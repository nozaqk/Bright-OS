# Bright OS GRUB Boot Menu Configuration
# Boot menu for the live/installation media (hybrid ISO: UEFI + BIOS)
#
# NOTE: This grub.cfg is for the LIVE MEDIUM only. The installed system's
# GRUB is configured by Calamares (grubcfg + bootloader modules) during install.

set default=0
set timeout=8
set gfxpayload=keep

# Load graphics modules and set high-resolution mode
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod vbe
    insmod gfxterm
    insmod png
    insmod tga
    terminal_output gfxterm
fi

# Try to load the Bright GRUB theme if present (graceful fallback if missing images)
if [ -s /boot/grub/themes/bright-os/theme.txt ]; then
    # GRUB themes with missing images produce errors; test theme loading safely
    if true; then
        set theme=/boot/grub/themes/bright-os/theme.txt
    fi
fi

# Bright OS color scheme (dark navy with blue accents) - applied as fallback
set menu_color_normal=white/black
set menu_color_highlight=white/blue
set color_normal=white/black
set color_highlight=white/blue
set border_color=dark-gray

# Main boot entries
menuentry "Start Bright OS Live (Default)" --class bright-os --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live quiet splash systemd.show_status=0 vt.global_cursor_default=0
    initrd /live/initrd.img
}

menuentry "Start Bright OS Live (Safe Graphics)" --class bright-os --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live nomodeset xforcevesa quiet splash
    initrd /live/initrd.img
}

menuentry "Start Bright OS Live (Verbose Boot)" --class bright-os --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live systemd.show_status=1
    initrd /live/initrd.img
}

menuentry "Start Bright OS Live (Recovery Mode)" --class bright-os --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live nox11autologin nopersistence debug
    initrd /live/initrd.img
}

menuentry "Boot from Hard Disk" --class os {
    insmod chain
    insmod part_gpt
    insmod part_msdos
    set root=(hd0)
    chainloader +1
}

submenu "Advanced options..." {
    menuentry "Bright OS Live (Force UEFI Mode)" --class bright-os {
        set gfxpayload=keep
        linux /live/vmlinuz boot=live quiet splash efi=runtime
        initrd /live/initrd.img
    }

    menuentry "Bright OS Live (BIOS Compatibility)" --class bright-os {
        set gfxpayload=keep
        linux /live/vmlinuz boot=live noapic noapm nodma nomce nolapic nomodeset nosmp
        initrd /live/initrd.img
    }

    menuentry "Bright OS Live (Single User Mode)" --class bright-os {
        set gfxpayload=keep
        linux /live/vmlinuz boot=live single
        initrd /live/initrd.img
    }
}
