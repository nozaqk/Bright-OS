# Bright OS Light Theme - Qt6ct Configuration
[Appearance]
color_scheme_path=/usr/share/bright-os/themes/light/colors.conf
custom_palette=true
style=Fusion
icon_theme=breeze
font=DejaVu Sans,10,-1,5,50,0,0,0,0,0
fixed_font=Hack,10,-1,5,45,0,0,0,0,0

[Settings]
double_click_interval=400
wheel_scroll_lines=3
cursor_blink_time=1200
cursor_flash_time=1000
activate_item_on_single_click=1
dialog_buttons_have_icons=true
menus_have_icons=true
show_shortcuts_in_context_menus=true
underline_shortcut=1
underline_shortcut_with_modifier=0
toolbutton_style=0
toolbutton_icon_size=22
toolbar_icon_size=22
