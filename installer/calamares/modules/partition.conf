# Calamares Partition Module
# Disk partitioning configuration

# Default initial installation choice
# "none" - start empty
# "replace" - offer to replace existing partition
# "alongside" - install alongside (dual boot)
# "erase" - use entire disk
# "manual" - manual partitioning
initialPartitioningChoice: none
defaultFileSystemType: "ext4"

# Show/hide partitioning choices
allowManualPartitioning: true
partitionLayoutChooser: true

# Reuse EFI partition if present
efiSystemPartitionSize: 300MiB
efiSystemPartitionName: "EFI System Partition"
# EFI minimum size (MB)
efiSystemPartitionSizeMinimum: 300

# Minimum sizes for required partitions (in MB)
requiredSpacePartition: 8192
# Recommended swap size
swapSize:
    - memory: 0
      size: 2048
    - memory: 2048
      size: 2048
    - memory: 4096
      size: 4096
    - memory: 8192
      size: 4096
    - memory: 16384
      size: 8192
    - memory: 65536
      size: 16384

# Available filesystems
defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - "ext4"
    - "btrfs"
    - "xfs"
    - "f2fs"

# Ensure /boot is on a supported filesystem
drawNestedPartitions: false

# Enable LUKS encryption option
enableLuksAutomatedPartitioning: true

# Partition layout for "erase" disk option
partitionLayout:
    - name: "EFI"
      type: efi
      filesystem: "fat32"
      mountPoint: "/boot/efi"
      size: 300MiB
      attributes: 0
      features:
        - "boot"
        - "esp"
    - name: "Root"
      type: normal
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
      minSize: 8192MiB
