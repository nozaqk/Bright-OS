# Calamares Bootloader Module Configuration for Bright OS
# Configures GRUB bootloader installation for both UEFI and Legacy BIOS.
#
# Tested against Calamares 3.3.x on Debian Trixie.
# References:
#   https://calamares.io/docs/modules/bootloader/
#   https://calamares.codeberg.page/docs/deploy-luks/

# --- EFI Configuration ---
# EFI bootloader binary name (standard for Debian amd64)
efiBootLoader: "grubx64.efi"

# EFI boot entry ID in NVRAM. Use a unique ID for Bright OS so it doesn't
# overwrite the "debian" boot entry that might exist from dual-boot systems.
efiBootLoaderId: "BrightOS"

# EFI installation path within the EFI System Partition
efiBootLoaderPath: "/EFI/BrightOS/grubx64.efi"

# --- GRUB Configuration ---
# Path to grub.cfg on the installed system
grubCfgPath: "/boot/grub/grub.cfg"

# Enable GRUB cryptodisk support (required for LUKS)
grubUseCryptodisk: true

# Kernel command line parameters
# quiet splash for normal boot; systemd.show_status=0 reduces boot noise;
# vt.global_cursor_default=0 hides blinking cursor during boot (Plymouth)
kernelLine: "quiet splash systemd.show_status=0 vt.global_cursor_default=0"
fallbackKernelLine: "systemd.show_status=1"

# --- GRUB Installation ---
# Where to find GRUB platform files
installFrom: "/usr/lib/grub/"

# Always run update-grub after install
update: true

# Do NOT set installPath to a fixed device. Leaving it unset lets Calamares
# choose the correct device automatically:
# - On UEFI: installs to the EFI System Partition and adds an NVRAM entry
# - On BIOS: installs MBR boot code to the disk containing /boot
# installPath is intentionally commented out:
# installPath:

# Prefer GPT; Calamares handles MBR automatically for legacy BIOS systems.
# No forced filesystem type here — GRUB supports ext4/btrfs/xfs.

# Don't install to removable media path (we use EFI Boot Entry ID instead)
# efiBootLoaderEntryRemovable: false

# Bootloader entry name (shown in firmware boot menu)
# This is set by our branding but we make it explicit
efiBootLoaderEntry: "Bright OS"
