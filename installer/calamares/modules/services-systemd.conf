# Calamares Services Module
# Enables systemd services in the installed Bright OS system.
# Services listed here will be enabled (systemctl enable) in the target.

services:
    # Display manager (required for graphical login)
    - name: "sddm.service"
      mandatory: true

    # Network management
    - name: "NetworkManager.service"
      mandatory: false
    - name: "NetworkManager-wait-online.service"
      mandatory: false

    # Audio (PipeWire via wireplumber)
    - name: "wireplumber.service"
      mandatory: false
    - name: "pipewire.service"
      mandatory: false
    - name: "pipewire-pulse.service"
      mandatory: false

    # Power management
    - name: "upower.service"
      mandatory: false

    # Disk management
    - name: "udisks2.service"
      mandatory: true

    # Firewall
    - name: "firewalld.service"
      mandatory: false

    # Printing (optional, may not be installed on Lite)
    - name: "cups.service"
      mandatory: false

    # Bluetooth (optional, may not be installed on Lite)
    - name: "bluetooth.service"
      mandatory: false

    # Time synchronization
    - name: "systemd-timesyncd.service"
      mandatory: false

    # SSD TRIM (safe periodic TRIM; preferred over continuous discard mount option)
    - name: "fstrim.timer"
      mandatory: false

    # First-boot setup (runs once after first reboot into installed system)
    - name: "bright-os-firstboot.service"
      mandatory: true

targets:
    # Boot to graphical target by default
    - name: "graphical.target"
      mandatory: true

# Services to disable (none currently disabled by default)
disable:
    []
