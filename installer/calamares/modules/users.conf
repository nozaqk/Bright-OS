# Calamares Users Module
# User account creation during install

# Default groups for the first user
defaultGroups:
    - "sudo"
    - "audio"
    - "video"
    - "network"
    - "netdev"
    - "storage"
    - "lp"
    - "scanner"
    - "bluetooth"
    - "plugdev"
    - "dialout"  # Serial port access (for Arduino/electronics)
    - "input"
    - "kvm"      # Virtualization
    - "docker"   # Docker access

autologinGroup: "autologin"
sudoersGroup: "sudo"

setRootPassword: true
doReusePassword: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true

# Password requirements
passwordRequirements:
    minLength: 4
    maxLength: -1
    requiresUppercase: false
    requiresLowercase: false
    requiresDigit: false
    requiresSpecial: false

# User/host name requirements
userNameRequirements:
    minLength: 1
    maxLength: 32
    regex: "^[a-z_][a-z0-9_-]*[$]?$"

hostNameRequirements:
    minLength: 1
    maxLength: 63
    regex: "^[a-zA-Z0-9]([-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?$"

# Default shell
userShell: "/bin/bash"
