# Calamares Welcome Module Configuration for Bright OS
# Displayed first: language selection, release notes, requirements check

welcomeStyle: "Welcome to Bright OS!"

# Url for the release notes page shown in the welcome screen
releaseNotesUrl: "https://github.com/nozaqk/Bright-OS/releases"
# Url for support link
supportUrl: "https://github.com/nozaqk/Bright-OS/issues"
# Known issues URL
knownIssuesUrl: "https://github.com/nozaqk/Bright-OS/issues"

# Requirements to check before allowing installation
requirements:
    # Check for required RAM (2GB minimum for Debian Trixie + Bright Desktop)
    - name: ram
      required: true
      enumeration: 2048
      type: ram
      negated: false
    # Check for enough disk space (16GB minimum)
    - name: storage
      required: true
      enumeration: 16
      type: storage
      negated: false
    # Check internet (not required for offline install, but recommended)
    - name: internet
      required: false
      type: internet
      negated: false
    # Check root privileges (calamares runs as root via pkexec)
    - name: root
      required: true
      type: check
      negated: false
    # Check for plugged-in power on laptops (warning only)
    - name: power
      required: false
      type: power
      negated: false
    # Check if running in a VM (warning only, not an error)
    - name: VM
      required: false
      type: check
      negated: false

# Show language list on the welcome page
showWelcomeLanguage: true
