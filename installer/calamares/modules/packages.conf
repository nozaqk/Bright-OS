# Calamares Packages Module Configuration for Bright OS
# Configured for offline install (packages come from the live medium).
#
# PRIMARY PURPOSE: Remove live-system packages that interfere with a properly
# installed Debian system. Per Calamares LUKS documentation, live-boot* packages
# MUST be removed before update-initramfs runs, otherwise the initramfs hook
# will fail to build correctly (breaking LUKS keyfile integration).
#
# Runs AFTER users/displaymanager but BEFORE initramfscfg/initramfs.
# Reference: https://calamares.codeberg.page/docs/deploy-luks/

backend: apt
update_db: false

# No additional packages to install during Calamares install
# (All Bright OS packages are already installed in the live image
# and copied to the target by unpackfs.)
packages: []

# Remove live-system packages that prevent a clean installed system.
# - live-boot, live-boot-initramfs-tools: live-boot hooks break initramfs
#   generation in the chroot (required for LUKS keyfile to work)
# - live-config, live-config-systemd: live session autoconfiguration scripts
# - live-tools: live-* helper tools not needed on installed system
# - live-build: only needed for building ISOs, not for running the OS
# We do NOT remove calamares itself here — it can be useful for debugging,
# and users can uninstall it.
remove-packages:
    - live-boot
    - live-boot-initramfs-tools
    - live-config
    - live-config-systemd
    - live-tools
    - live-build

# Try removing packages but don't fail the install if any are already gone
try_remove: true
