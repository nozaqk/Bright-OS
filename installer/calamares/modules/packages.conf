# Calamares Packages Module
# Configured for offline install (packages come from live medium).
#
# We use this module primarily to REMOVE live-system packages that would
# interfere with a proper installed system (particularly update-initramfs
# which is needed for LUKS keyfile integration).
#
# From Calamares LUKS documentation:
# "The packages module must be configured to remove ^live-* packages so
# that update-initramfs can run properly"

backend: apt
update_db: false

# No additional packages to install during Calamares install
packages: []

# Remove live-system packages before initramfs runs
# These packages prevent update-initramfs from working correctly in chroot
remove-packages:
    - live-boot
    - live-boot-initramfs-tools
    - live-config
    - live-config-systemd
    - live-tools
    - live-build
