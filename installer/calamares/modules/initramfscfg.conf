# Calamares initramfscfg module configuration
# Configures initramfs-tools for Debian systems to include LUKS keyfile
# and /etc/crypttab in the initramfs image.
#
# This module must run after luksbootkeyfile and before initramfs.
# No specific configuration needed for Debian; the module uses defaults
# that copy /crypto_keyfile.bin into initramfs.
