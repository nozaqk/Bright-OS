# Calamares Network Configuration for Bright OS
# Sets up hostname and copies network configuration from live system (optional).

# Copy NetworkManager connection profiles from live system?
# false = don't copy Wi-Fi passwords (privacy-preserving default).
# Users can reconnect to Wi-Fi after install.
copyNetworkConfigurations: false

# Save the hostname that was configured during installation
# (user-set in the Users page)
saveHostname: true

# Fallback hostname if none is provided by the user
hostname: "bright-os"

# Ensure NetworkManager config directory exists
# (handled automatically by the module)
