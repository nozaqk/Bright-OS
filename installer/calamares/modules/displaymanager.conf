# Calamares Display Manager Module Configuration
# Configures SDDM as the display manager for the installed Bright OS system.
# This module MUST run during installation; without it, the installed system
# will boot to a text console instead of the graphical login screen.

# --- Display Manager Selection ---
# Use SDDM (Simple Desktop Display Manager) which is the display manager
# installed by Bright OS (sddm package in core.list.chroot).
displaymanagers:
    - sddm

# --- Default Desktop Session ---
# New users default to Bright Desktop.
defaultDesktopSession: "bright.desktop"

# --- SDDM-specific configuration ---
sddm:
    # Use Breeze theme (consistent with Bright OS visual identity)
    theme: breeze

    # Enable HiDPI
    enableHiDPI: true

# --- Autologin ---
# No autologin by default (user explicitly enabled it in users module).
# The users module handles per-user autologin preference.
# Do NOT force autologin here — it's a user choice.

# --- Sysinit setup ---
# Ensure basic sysinit setup
basicSetup: true
