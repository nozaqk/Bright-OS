# Calamares Display Manager Module Configuration (Phase 6.3)
# Configures the default display manager for installed Bright OS.
# greetd is preferred (lightweight, Phase 6.3 default); SDDM is listed
# second so Calamares falls back to it when greetd is not installed
# (e.g. when the optional-recovery-kwin profile was selected without greetd).

# --- Display Manager Selection (ordered by preference) ---
displaymanagers:
    - greetd
    - sddm

# --- Default Desktop Session ---
# New users default to Bright Desktop (labwc). The .desktop suffix tells
# Calamares this is a Wayland session.
defaultDesktopSession: "bright.desktop"

# --- greetd-specific configuration ---
# greetd drops a config file in /etc/greetd/config.toml at image build time;
# no extra config is required here (Calamares just enables the service).

# --- SDDM-specific configuration (used as fallback) ---
sddm:
    theme: breeze
    enableHiDPI: true

# --- Basic setup (create user/group, enable systemd service, etc.) ---
basicSetup: true
