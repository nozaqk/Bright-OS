# Calamares UnpackFS Module
# Uses rsync from the live system root to the target.
# This is more reliable for Debian live systems than trying to
# find the squashfs which may be in various locations.
#
# Using sourcefs: "mount" with the root bind-mounted via the live
# system's /run/live/rootfs/filesystem.squashfs mount.
# If that doesn't work, Calamares falls back to rsync source.

# Method 1: Copy from live system using rsync (most reliable)
# We mount the target and copy with rsync
unpack:
    - source: "/"
      sourcefs: "rsync"
      destination: ""
      excludeFile: "/usr/share/calamares/modules/unpackfs/exclude-list"
