# Calamares UnpackFS Module for Bright OS (Debian Live)
# Copies the live system root filesystem to the target partition using rsync.
#
# This is the most reliable method for Debian Live systems because:
# - The live system is the union of the squashfs + overlay
# - rsync respects the exclude list to not copy live artifacts
# - Works regardless of how the live medium is booted (USB/DVD/PXE)

unpack:
    - source: "/"
      sourcefs: "rsync"
      destination: ""
      excludeFile: "/usr/share/bright-os/installer/exclude-list"
