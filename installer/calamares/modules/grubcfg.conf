# GRUB configuration module for Calamares
# Configures GRUB bootloader after installation
#
# Key settings for Debian + LUKS support:
# - GRUB_ENABLE_CRYPTODISK=y enables GRUB to unlock LUKS partitions at boot

# Default kernel options (distributed to all installed kernels)
# Override /etc/default/grub settings as needed
overwrite: false

# GRUB defaults to set
grubDefaults:
    GRUB_TIMEOUT: "5"
    GRUB_TIMEOUT_STYLE: "menu"
    GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash"
    GRUB_ENABLE_CRYPTODISK: "y"

# Distributor string (shown in GRUB menu)
grubDistributor: "Bright OS"
