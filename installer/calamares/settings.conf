# Bright OS Calamares Installer Settings
# Main configuration file for the Calamares installer

modules-search:
    - /usr/lib/x86_64-linux-gnu/calamares/modules
    - /etc/calamares/modules
    - /usr/share/calamares/modules

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - networkcfg
        - hwclock
        - services-systemd
        - bootloader
        - luksbootkeyfile
        - grubcfg
        - shellprocess-post
        - initramfs
        - ucode
    - show:
        - finished

# Branding
branding: bright-os

# Window sizing
window-size:
    width:  1000
    height: 700

# Debugging
debug: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false

# Minimum requirements
required-space: 10GB
required-ram: 1GB
