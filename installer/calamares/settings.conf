# Bright OS Calamares Installer Settings
# Main configuration file for the Calamares installer
#
# Note: Modules listed in the exec sequence must exist as Calamares modules.
# We use the standard Calamares modules shipped with the calamares package,
# plus a custom shellprocess instance (shellprocess-post) for post-install.

modules-search:
    - /usr/lib/x86_64-linux-gnu/calamares/modules
    - /etc/calamares/modules
    - /usr/share/calamares/modules

# Module instances: shellprocess-post is an instance of the shellprocess module
instances:
    - id: shellprocess-post
      module: shellprocess
      config: shellprocess-post.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - networkcfg
        - hwclock
        - services-systemd
        - bootloader
        - grubcfg
        - luksbootkeyfile
        - shellprocess-post
        - initramfs
    - show:
        - finished

# Branding
branding: bright-os

# Window sizing
window-size:
    width:  1000
    height: 700

# Debugging
debug: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false

# Minimum requirements
required-space: 10GB
required-ram: 1GB
