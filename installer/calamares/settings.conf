# Bright OS Calamares Installer Settings
# Main configuration file for the Calamares installer

modules-search:
    - /usr/lib/x86_64-linux-gnu/calamares/modules
    - /etc/calamares/modules
    - /usr/share/calamares/modules

instances:
    - id:       default
      module:   welcome
      weight:   -1
    - id:       netinstall
      module:   netinstall
      weight:   -1
    - id:       offline
      module:   packages
      config:   packages-offline.conf
      weight:   -1

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - networkcfg
        - hwclock
        - services-systemd
        - bootloader
        - packages
        - luksbootkeyfile
        - grubcfg
        - shellprocess-post
        - initramfs
        - ucode
    - show:
        - finished

# Branding
branding: bright-os
# Sizing
window-size:
    width:  1000
    height: 680

# Don't show debug window by default
debug: false
# Don't ask for confirmation on quit
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false

# Installation requires at least this much space and RAM
required-space: 10GB
required-ram: 1GB
