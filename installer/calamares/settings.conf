# Bright OS Calamares Installer Settings
# Main configuration file for the Calamares installer
#
# Module ordering follows the official Calamares LUKS setup guide:
#   https://calamares.codeberg.page/docs/deploy-luks/
#
# Correct sequence for Debian with LUKS support:
#   luksbootkeyfile -> packages(remove live-*) -> initramfscfg -> initramfs -> grubcfg -> bootloader
#
# Modules must be installed by the calamares package. Modules we ship configs for:
#   - welcome, locale, keyboard, partition, users, summary, finished (view modules)
#   - mount, unpackfs, machineid, fstab, localecfg, networkcfg, hwclock
#   - services-systemd, packages (apt, removes live-* packages)
#   - luksbootkeyfile (LUKS keyfile setup)
#   - initramfscfg (initramfs-tools hook for keyfile/crypttab)
#   - initramfs (runs update-initramfs)
#   - grubcfg (GRUB config including cryptodisk)
#   - bootloader (installs GRUB to MBR/EFI)
#   - shellprocess-post (our custom post-install cleanup)

modules-search:
    - /usr/lib/x86_64-linux-gnu/calamares/modules
    - /etc/calamares/modules
    - /usr/share/calamares/modules

# Module instances
instances:
    - id: shellprocess-post
      module: shellprocess
      config: shellprocess-post.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - networkcfg
        - hwclock
        - services-systemd
        - packages
        - luksbootkeyfile
        - initramfscfg
        - initramfs
        - grubcfg
        - bootloader
        - shellprocess-post
    - show:
        - finished

# Branding
branding: bright-os

# Window sizing
window-size:
    width:  1000
    height: 700

# Debugging
debug: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false

# Minimum requirements
required-space: 10GB
required-ram: 1GB
